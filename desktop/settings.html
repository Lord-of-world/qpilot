<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>qpilot settings</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --panel: #15151b;
      --border: rgba(255, 255, 255, 0.08);
      --fg: #f5f5f7;
      --muted: #8e8e99;
      --accent: #f5f5f7;
      --danger: #f2555a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 32px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-user-select: none;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 22px; }
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      padding: 4px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); margin-bottom: 20px;
    }
    .seg label {
      text-align: center; padding: 7px 8px; border-radius: 7px; cursor: default;
      color: var(--muted);
    }
    .seg input { display: none; }
    .seg input:checked + span { color: var(--fg); }
    .seg label:has(input:checked) { background: rgba(255, 255, 255, 0.08); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 500; margin-bottom: 5px; }
    .field .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--fg);
      font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-user-select: text; outline: none;
    }
    input:focus { border-color: rgba(255, 255, 255, 0.25); }
    .error {
      display: none; margin: 4px 0 14px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(242, 85, 90, 0.3); background: rgba(242, 85, 90, 0.07);
      color: var(--danger); -webkit-user-select: text;
    }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .actions .path { color: var(--muted); font-size: 11px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      padding: 8px 18px; border-radius: 8px; border: 0; font: inherit; font-weight: 600;
      background: var(--accent); color: #111;
      white-space: nowrap; flex-shrink: 0;
    }
    button:disabled { opacity: 0.5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>

  <form id="form" autocomplete="off">
    <div class="seg">
      <label><input type="radio" name="provider" value="anthropic" checked><span data-t="anthropic"></span></label>
      <label><input type="radio" name="provider" value="custom"><span data-t="custom"></span></label>
    </div>

    <div class="field" data-for="custom">
      <label for="baseURL">Base URL</label>
      <input type="text" id="baseURL" placeholder="https://…/v1" spellcheck="false">
    </div>

    <div class="field">
      <label for="apiKey" data-t="keyLabel"></label>
      <input type="password" id="apiKey" spellcheck="false">
    </div>

    <div class="field">
      <label for="model" data-t="modelLabel"></label>
      <input type="text" id="model" spellcheck="false">
      <div class="hint" data-for="custom" data-t="modelHint"></div>
    </div>

    <div class="field" data-for="anthropic">
      <label for="anthropicBaseURL" data-t="proxyLabel"></label>
      <input type="text" id="anthropicBaseURL" placeholder="https://api.anthropic.com" spellcheck="false">
      <div class="hint" data-t="proxyHint"></div>
    </div>

    <div class="error" id="error"></div>

    <div class="actions">
      <span class="path" id="path"></span>
      <button type="submit" id="save" data-t="save"></button>
    </div>
  </form>

  <script>
    const STRINGS = {
      en: {
        title: "Model provider",
        sub: "qpilot needs a model that supports tool calling to drive the browser.",
        anthropic: "Anthropic (Claude)",
        custom: "OpenAI-compatible",
        keyLabelAnthropic: "Anthropic API key",
        keyLabelCustom: "API token",
        modelLabel: "Model id",
        modelHint: "For example qwen2.5-72b-instruct. The model must support tool calling.",
        proxyLabel: "Base URL (optional)",
        proxyHint: "Only for reaching Claude through a corporate proxy. Leave empty for api.anthropic.com.",
        save: "Save and open",
        saving: "Starting…",
        savedIn: "Saved in",
      },
      ru: {
        title: "Провайдер модели",
        sub: "qpilot нужна модель с поддержкой вызова инструментов (tool calling), чтобы управлять браузером.",
        anthropic: "Anthropic (Claude)",
        custom: "OpenAI-совместимый",
        keyLabelAnthropic: "API-ключ Anthropic",
        keyLabelCustom: "API-токен",
        modelLabel: "ID модели",
        modelHint: "Например, qwen2.5-72b-instruct. Модель должна поддерживать tool calling.",
        proxyLabel: "Base URL (необязательно)",
        proxyHint: "Только для доступа к Claude через корпоративный прокси. Оставьте пустым для api.anthropic.com.",
        save: "Сохранить и открыть",
        saving: "Запускаю…",
        savedIn: "Хранится в",
      },
    };
    const t = STRINGS[navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en"];
    document.documentElement.lang = t === STRINGS.ru ? "ru" : "en";
    document.querySelectorAll("[data-t]").forEach((el) => {
      const key = el.dataset.t;
      if (t[key]) el.textContent = t[key];
    });

    const $ = (id) => document.getElementById(id);
    const form = $("form");
    const provider = () => form.querySelector("input[name=provider]:checked").value;
    let defaultModel = "";

    function syncProvider() {
      const p = provider();
      document.querySelectorAll("[data-for]").forEach((el) => {
        el.hidden = el.dataset.for !== p;
      });
      document.querySelector("[data-t=keyLabel]").textContent =
        p === "custom" ? t.keyLabelCustom : t.keyLabelAnthropic;
      $("apiKey").placeholder = p === "custom" ? "" : "sk-ant-…";
      $("model").placeholder = p === "custom" ? "qwen2.5-72b-instruct" : defaultModel;
    }
    form.querySelectorAll("input[name=provider]").forEach((r) => r.addEventListener("change", syncProvider));

    function showError(msg) {
      $("error").textContent = msg || "";
      $("error").style.display = msg ? "block" : "none";
    }

    window.qpilot.getSettings().then(({ config, configPath, defaultModel: dm }) => {
      defaultModel = dm;
      $("path").textContent = `${t.savedIn} ${configPath.replace(/^\/Users\/[^/]+/, "~")}`;
      if (config) {
        form.querySelector(`input[value=${config.provider === "custom" ? "custom" : "anthropic"}]`).checked = true;
        $("apiKey").value = config.apiKey || "";
        $("model").value = config.model || "";
        if (config.provider === "custom") $("baseURL").value = config.baseURL || "";
        else $("anthropicBaseURL").value = config.baseURL || "";
      }
      syncProvider();
      (config ? $("save") : $("apiKey")).focus();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      const p = provider();
      $("save").disabled = true;
      $("save").textContent = t.saving;
      const res = await window.qpilot.saveSettings({
        provider: p,
        apiKey: $("apiKey").value,
        model: $("model").value,
        baseURL: p === "custom" ? $("baseURL").value : $("anthropicBaseURL").value,
      });
      if (!res.ok) {
        showError(res.error);
        $("save").disabled = false;
        $("save").textContent = t.save;
      }
    });
  </script>
</body>
</html>
